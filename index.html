<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi bitácora</title>
<meta name="theme-color" content="#f1eee8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calma de lámina de arquitectura; poco texto, mucho espacio
   IDEA: una infografía arquitectónica: volúmenes, recorridos y planos sobre papel crudo, con una figura humana diminuta
   PICTURE: el volumen 3D de tu vida en Inicio y el recorrido de círculos del día en Hoy
   COLOUR and TYPE: papel #f1eee8, tinta negra, rojo para lo importante, azul pizarra para la estructura; Inter Tight
   LAYOUT: de lo general al detalle: una imagen grande, pocas cifras, y el detalle detrás de bloques numerados */
:root{color-scheme:light dark;
--bg:light-dark(#f1eee8,#141618);--paper:light-dark(#f8f6f1,#1c1f22);--ink:light-dark(#141414,#eceae4);--soft:light-dark(#66635d,#a3a19b);--line:light-dark(#d8d3c9,#30343a);
--red:#d92b1c;--red2:#8a1d14;--red3:#b8241a;--redtop:#ec5440;
--blue:#6f9395;--blue2:#4f6f71;--blue3:#62868a;--bluetop:#9dbbbb;--bluesoft:light-dark(#dde6e5,#26302f);
--sand:#d8c4a2;--ochre:#d6a13f;--terra:#c55a3e;--mist:#aac3c2;--stone:#a39f97;--pale:#cdc7bb}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(4vw,16px) 72px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:var(--ink)}
.brand b{font-size:19px;font-weight:700}.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;min-height:42px;padding:0 12px;color:var(--soft);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--red)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h2{font-size:clamp(34px,5vw,52px);line-height:1.02;font-weight:700;letter-spacing:-.02em;margin:26px 0 6px;text-wrap:balance}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:22px 0 0;font-weight:600}
h3{font-size:19px;margin:34px 0 12px;font-weight:700;display:flex;gap:10px;align-items:baseline;line-height:1.2}
h3 .n{font-size:24px;font-weight:800}
.muted{color:var(--soft)}
.status{margin:8px 0 0;padding:10px 14px;background:var(--paper);border-left:4px solid var(--red);font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)!important;gap:0}}
.box{background:var(--paper);padding:20px 22px;border:1px solid var(--line)}
.big{font-size:clamp(52px,9vw,96px);font-weight:800;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big.red{color:var(--red)}
.lead{font-size:18px;color:var(--soft);margin:8px 0 0;max-width:60ch}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:0;padding:10px 12px;min-height:44px}
input[type=file]{padding:8px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--red)}
textarea{min-height:84px;resize:vertical}
button{font:inherit}
.btn{min-height:44px;padding:0 20px;border:0;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.link{background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;padding:6px;min-height:36px;font-size:14px}
.back{background:none;border:0;cursor:pointer;font-weight:600;font-size:15px;padding:8px 0;min-height:40px;color:var(--ink)}
.card{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.card .body{flex:1}.card .t{font-weight:600}.card .meta{font-size:14px;color:var(--soft)}
.card.done .t{text-decoration:line-through;color:var(--soft)}
.chk{width:24px;height:24px;min-height:0;margin:1px 0 0;accent-color:var(--red);flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;background:var(--bluesoft);color:var(--ink);white-space:nowrap;vertical-align:middle}
.pill.hot{background:var(--red);color:#fff}
.form{display:grid;gap:12px;padding:18px;background:var(--paper);border:1px solid var(--line);margin:0 0 16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:38px;padding:0 14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;cursor:pointer;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.empty{padding:16px 18px;border:1.5px dashed var(--line);color:var(--soft);font-size:15px}
.scroll{overflow-x:auto}
.mnav{display:flex;align-items:center;gap:12px;margin:6px 0 0}
.mnav strong{font-size:18px;min-width:150px;text-align:center}
.ask{display:inline-flex;gap:4px;align-items:center;font-size:14px}
a.ext{color:var(--red);font-size:14px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin:12px 0}
.legend i{display:inline-block;width:18px;height:10px;vertical-align:middle;margin-right:6px}
details{border-top:2px solid var(--ink);padding:14px 0;margin:28px 0 0}
summary{cursor:pointer;font-weight:700;font-size:17px;min-height:30px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;font-weight:400;line-height:1}
details[open]>summary::after{content:"–"}
/* inicio 3D */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:860px){.home{grid-template-columns:minmax(0,1fr)}}
#stage{position:relative;height:clamp(340px,52vw,520px);perspective:2600px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage:active{cursor:grabbing}
#rig{position:absolute;left:50%;top:66%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--sc,1)) rotateX(-24deg) rotateY(var(--ry,30deg))}
.bx{position:absolute;transform-style:preserve-3d;cursor:pointer}
.fc{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;color:#fff;padding:8px 10px;display:flex;flex-direction:column;justify-content:flex-start}
.fc b{font-size:18px;font-weight:800;line-height:1}.fc small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;opacity:.95}
.bx .t{background:var(--bluetop)}.bx .f{background:var(--blue)}.bx .r{background:var(--blue2)}.bx .l{background:var(--blue3)}.bx .k{background:#46625f}
.bx.sel .t{background:var(--redtop)}.bx.sel .f{background:var(--red)}.bx.sel .r{background:var(--red2)}.bx.sel .l{background:var(--red3)}.bx.sel .k{background:#741810}
.shadow{position:absolute;left:50%;top:66%;width:520px;height:120px;transform:translate(-50%,-30%);background:radial-gradient(closest-side,rgba(0,0,0,.10),transparent);pointer-events:none}
.bb{position:absolute;transform-style:preserve-3d;pointer-events:none}
.ctrl{display:flex;gap:10px;align-items:center;margin-top:4px}
.ctrl input{flex:1}
.areas{list-style:none;margin:0;padding:0}
.areas button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left;cursor:pointer;color:var(--ink)}
.areas button b{font-size:22px;font-weight:800}
.areas button[aria-pressed=true] b,.areas button[aria-pressed=true] .nm{color:var(--red)}
.areas .nm{font-weight:700;font-size:17px}.areas .st{font-size:13px;color:var(--soft)}
.callout{border-left:4px solid var(--red);padding:4px 0 4px 18px;margin:6px 0 18px}
.callout .no{font-size:44px;font-weight:800;line-height:1;color:var(--red)}
.callout .ti{font-size:26px;font-weight:700;margin:4px 0}
.callout ul{margin:6px 0 14px;padding-left:18px;color:var(--soft)}
/* inicio: campo vivo */
:root{--fbg:#f1eee8;--fink:#1b1b1b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--fbg:#141618;--fink:#ecebe6}}
:root[data-theme=dark]{--fbg:#141618;--fink:#ecebe6}
.fhero{margin-top:10px}
.fptop{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:12px 0 4px}
.ftitle{font-size:clamp(26px,4vw,44px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:4px 0 0}
#fcv{display:block;width:100%;touch-action:manipulation;margin-top:4px}
.fkey{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:6px}
.fkey button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--ink);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;min-height:36px}
.fkey i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 60% 55%,var(--a) 0 38%,var(--al) 75%)}
.fkey button:hover{color:var(--a)}
.fhint{text-align:center;margin:4px auto 0;font-size:13px;color:var(--soft);max-width:60ch}
.fsum{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;margin-top:34px}
@media(max-width:760px){.fsum{grid-template-columns:minmax(0,1fr)}}
.htop{display:flex;align-items:flex-end;gap:1px;height:80px;border-bottom:1px solid var(--line)}
.htop>div{flex:1;min-width:0;height:100%;display:flex;flex-direction:column-reverse}.htop>div i{display:block;width:100%}
.htop>div.now{outline:1.5px solid var(--ink);outline-offset:1px}
.hside{display:flex;flex-direction:column;gap:2px}
.hside button{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm v" "bar bar";gap:4px 8px;background:none;border:0;padding:7px 0;cursor:pointer;color:var(--ink);text-align:left}
.hside .nm{grid-area:nm;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.08em}.hside .nm b{color:var(--a);font-weight:800}
.hside .v{grid-area:v;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ad)}.hside em{font-style:normal;font-size:11px;font-weight:700;margin-left:6px;color:var(--soft)}
.hside .bar{grid-area:bar;height:10px;background:color-mix(in srgb,var(--al) 30%,transparent)}.hside .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--al),var(--a))}
.hside button:hover .nm{color:var(--a)}
.hindex{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 28px;margin:36px 0 0}
.hindex section{border-top:3px solid var(--a);padding-top:8px}
.hindex .hh{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0 0 6px;cursor:pointer;color:var(--ink);font-weight:800;font-size:18px;text-align:left}
.hindex .hh b{color:var(--a)}.hindex .hh span{font-size:13px;font-weight:500;color:var(--soft)}
.hindex div{display:flex;flex-direction:column;align-items:flex-start}
.hindex div button{background:none;border:0;padding:5px 0;min-height:32px;cursor:pointer;color:var(--ink);font-size:15px;text-align:left}
.hindex div button:hover{color:var(--ad);text-decoration:underline}
/* paleta: un color por área, todo sobre el crema */
:root{--paper:transparent;--bluesoft:color-mix(in srgb,var(--bluetop) 32%,transparent)}
:root[data-area]:not([data-area='']){--mist:color-mix(in srgb,var(--bluetop) 70%,var(--blue));--stone:color-mix(in srgb,var(--blue) 55%,var(--bg))}
:root:not([data-area]),:root[data-area='']{--red:#1b1b1b}
#fcv{-webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 62%,transparent 100%)}
:root[data-area=hoy]{--blue:#ec8a1c;--blue2:#b5530b;--blue3:#d9761a;--bluetop:#ffd24a;--red:#b5530b;--red2:#7d3a08;--red3:#9a470a;--redtop:#ec8a1c}
:root[data-area=habitos]{--blue:#2a7fd4;--blue2:#1b3594;--blue3:#2366b8;--bluetop:#86d4f4;--red:#1b3594;--red2:#122468;--red3:#1a2e80;--redtop:#2a7fd4}
:root[data-area=arte]{--blue:#d4247c;--blue2:#76135c;--blue3:#b31c6c;--bluetop:#f6a3c6;--red:#76135c;--red2:#4d0c3c;--red3:#5f104b;--redtop:#d4247c}
:root[data-area=finanzas]{--blue:#2f9460;--blue2:#18573f;--blue3:#277d52;--bluetop:#bfe28f;--red:#18573f;--red2:#0f3a2a;--red3:#144a36;--redtop:#2f9460}
:root[data-area=lectura]{--blue:#6b4cc2;--blue2:#331c70;--blue3:#5a3eaa;--bluetop:#cdb9f2;--red:#331c70;--red2:#21124a;--red3:#2a175c;--redtop:#6b4cc2}
nav a::before{content:"";width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none;background:var(--line)}
nav a[data-nav=inicio]::before{background:conic-gradient(#ec8a1c 0 20%,#2a7fd4 0 40%,#d4247c 0 60%,#2f9460 0 80%,#6b4cc2 0)}
nav a[data-nav=hoy]::before{background:#ec8a1c}nav a[data-nav=habitos]::before{background:#2a7fd4}nav a[data-nav=arte]::before{background:#d4247c}nav a[data-nav=finanzas]::before{background:#2f9460}nav a[data-nav=lectura]::before{background:#6b4cc2}
.quick{background:transparent!important;color:var(--ink)!important;border-left:4px solid var(--blue);padding:4px 0 4px 18px!important}
.quick label{color:var(--soft)!important}.quick textarea,.quick select{background:transparent!important;color:var(--ink)!important;border-color:var(--line)!important}
.quick .chips button{border-color:var(--ink)!important;color:var(--ink)!important}.quick .chips button[aria-pressed=true]{background:var(--ink)!important;color:var(--bg)!important}
.box,.form,.steppanel,.idea{background:transparent}
.form{border:0;border-left:3px solid var(--bluetop);padding:6px 0 6px 18px}
.status{background:transparent}
/* recorrido del día */
.path{position:relative;width:100%;max-width:760px}
.path svg{display:block;width:100%;height:auto}
.path .hit{position:absolute;border-radius:50%;background:transparent;border:0;cursor:pointer;padding:0}
.path .hit[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:6px}
.steppanel{background:transparent;border-left:4px solid var(--red);padding:6px 0 6px 18px;margin:8px 0 0}
.steppanel .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.meter{height:14px;background:var(--bluesoft);margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--red)}
/* hábitos */
.slabs{display:flex;flex-direction:column;gap:12px;margin:22px 0 8px;max-width:760px}
.srow{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center}.srow>span{font-size:14px;font-weight:600}.srow.best>span{color:var(--red)}
.slab{position:relative;height:44px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:14px;font-weight:800;white-space:nowrap;min-width:52px}
.slab.red{background:var(--red)}
.slab.zero{background:var(--bluesoft);color:var(--ink)}
@media(max-width:600px){.srow{grid-template-columns:120px minmax(0,1fr)}.srow>span{font-size:13px}}
.slab .fig{position:absolute;right:16px;bottom:100%}
.hgrid{display:grid;grid-template-columns:170px repeat(var(--n),minmax(18px,1fr)) 52px;align-items:center;gap:3px 2px;min-width:780px}
.hgrid .lab{font-size:14px;font-weight:500;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hgrid .dn{font-size:11px;text-align:center;color:var(--soft)}.hgrid .dn.today{color:var(--red);font-weight:700}
.cell{width:18px;height:18px;margin:auto;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0;min-height:0}
.cell.full{background:var(--blue);border-color:var(--blue)}
.cell.min{background:linear-gradient(135deg,var(--blue) 50%,transparent 50%);border-color:var(--blue)}
.cell.fut{opacity:.35}
.pct{font-size:13px;font-weight:700;text-align:right}
.cols{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;max-width:20px;background:var(--blue);min-height:3px}
.cols i.zero{background:var(--line)}.cols i.today{background:var(--red)}
.cols span{font-size:10px;color:var(--soft)}
/* bloques numerados */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0;border-top:2px solid var(--ink);margin-top:18px}
.tile{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 16px 18px 0;cursor:pointer;color:var(--ink);min-height:120px}
.tile b{font-size:26px;font-weight:800;line-height:1}
.tile .nm{font-size:18px;font-weight:700}
.tile .st{font-size:14px;color:var(--soft)}
.tile .sq{width:14px;height:14px;background:var(--blue);margin-bottom:6px}
.tile.hot .sq{background:var(--red)}
.tile:hover .nm{color:var(--red)}
.alert{display:flex;gap:14px;align-items:center;background:var(--red);color:#fff;padding:14px 18px;margin:18px 0 0;font-weight:600}
.alert b{font-size:30px;font-weight:800;line-height:1}
.pipe{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 18px}
.pipe div{flex:1 1 110px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;background:var(--bluesoft)}
.pipe div.on{background:var(--blue);color:#fff}.pipe div.cur{background:var(--red);color:#fff}
.pipe b{font-size:18px}
/* referentes */
.fase{margin-top:26px}.fhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px}.fhead b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}.fhead .nm{font-size:22px;font-weight:800}
.fuentes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fuente{position:relative}.fuente a{display:flex;flex-direction:column;gap:4px;min-height:118px;padding:14px 16px;background:var(--blue);color:#fff;text-decoration:none}
.fuente a:hover{background:var(--red)}.fuente b{font-size:20px;font-weight:800}.fuente span{font-size:13px;line-height:1.35;opacity:.95}.fuente i{font-style:normal;margin-top:auto;font-size:18px}
.fdel{position:absolute;top:2px;right:2px;color:#fff;text-decoration:none;font-size:18px}
.gmap{display:flex;flex-direction:column;gap:6px;margin:16px 0 8px;max-width:760px}
.gm{display:grid;grid-template-columns:190px minmax(0,1fr) 28px;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.gm i{display:block;height:22px;background:var(--blue)}.gm.red i{background:var(--red)}.gm.zero i{background:var(--bluesoft)}.gm b{text-align:right}
.rgh{display:flex;justify-content:space-between;margin:26px 0 4px;font-size:15px;border-top:2px solid var(--ink);padding-top:8px}
.rcard{border-bottom:1px solid var(--line)}

async function shrink(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,2400/Math.max(bmp.width,bmp.height));if(s===1&&file.size<8e6)return file;
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.88))}catch(_){return file}}
async function uploadOne(file){if(!S.assets){say('Subir imágenes solo funciona cuando inicias sesión.');return ''}say('Subiendo imagen…');

function perf(area,date){const day=dayOf(date),mins=day.mins||{};const st=k=>STEPS.find(s=>s.k===k);const A=actByDay();
  const rat=k=>{const s=st(k),id=s?ideal(s):0;return Math.max(mk(day[k]),id?Math.min(1,(Number(mins[k])||0)/id):0)};
  if(area==='hoy')return dayProgress(date)/100;
  if(area==='habitos')return HABITS.reduce((t,h)=>t+mk(day[h.k]),0)/HABITS.length;
  if(area==='arte'){const fi=ideal(st('foto'))+ideal(st('foto2'));const m=(Number(mins.foto)||0)+(Number(mins.foto2)||0);return Math.min(1,Math.max(mk(day.foto),fi?m/fi:0)+0.25*(A.a[date]||0))}
  if(area==='lectura')return Math.min(1,(rat('lit')+rat('est'))/2+(A.b[date]?0.5:0));
  if(area==='finanzas')return Math.min(1,rat('emp')*0.7+(A.g[date]?0.3:0));
  return 0}

function towerSvg(){
  const s=38,c=Math.cos(Math.PI/6)*s,h=s/2,N=3,Lv=8,u=.86;
  const P=(x,y,z)=>[(x-y)*c,(x+y)*h-z*s];
  const cubes=[];for(let k=0;k<Lv;k++)for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(k===Lv-1&&i===N-1&&j===N-1)continue;cubes.push([i,j,k])}
  const hang=[N-1,N-1,Lv+1.4];
  const poly=pts=>pts.map(p=>P(...p).map(v=>v.toFixed(1)).join(',')).join(' ');
  const cube=([i,j,k])=>{const t=k+u,a=i+u,b=j+u;return `<polygon points="${poly([[i,b,k],[a,b,k],[a,b,t],[i,b,t]])}" fill="var(--blue2)"/><polygon points="${poly([[a,j,k],[a,b,k],[a,b,t],[a,j,t]])}" fill="var(--blue)"/><polygon points="${poly([[i,j,t],[a,j,t],[a,b,t],[i,b,t]])}" fill="var(--bluetop)"/>`};
  cubes.sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])||p[2]-q[2]);
  const top=P(hang[0]+u/2,hang[1]+u/2,hang[2]+u+2.2);const ht=hang[2]+u;
  const corners=[[hang[0],hang[1],ht],[hang[0]+u,hang[1],ht],[hang[0]+u,hang[1]+u,ht],[hang[0],hang[1]+u,ht]].map(p=>P(...p));
  const fig=P(hang[0]+u*.55,hang[1]+u*.45,ht);
  const xs=[-N*c,N*c],minY=top[1]-40,maxY=P(N,N,0)[1]+6;
  return `<svg viewBox="${(xs[0]-10).toFixed(0)} ${minY.toFixed(0)} ${(xs[1]-xs[0]+20).toFixed(0)} ${(maxY-minY).toFixed(0)}" role="img" aria-label="Torre de cubos rojos con un cubo suspendido y una figura humana encima">
  <line x1="${top[0]}" y1="${minY}" x2="${top[0]}" y2="${top[1]}" stroke="var(--ink)" stroke-width="1.4"/>
  ${corners.map(p=>`<line x1="${top[0]}" y1="${top[1]}" x2="${p[0]}" y2="${p[1]}" stroke="var(--ink)" stroke-width="1.2"/>`).join('')}
  ${cubes.map(cube).join('')}${cube(hang)}
  <g transform="translate(${(fig[0]-6).toFixed(1)} ${(fig[1]-27).toFixed(1)})" color="var(--ink)">${FIG(27).replace('<svg ','<svg x="0" y="0" ')}</g></svg>`;
}

    ${G.map((g,i)=>{const v=gsum(g,k);return `<div class="brow" style="margin-top:18px;border-top:2px solid var(--ink);padding-top:8px"><strong><i style="display:inline-block;width:12px;height:12px;background:${GC[i%3]};margin-right:6px"></i>${esc(g.name)}</strong><span class="num">${money(v)} <span class="muted">${neto?Math.round(v/neto*100):0}%</span></span></div>${(g.items||[]).filter(x=>Number(x[k])).map(x=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(50px,100px) 92px;gap:10px;align-items:center;margin:6px 0"><span style="font-size:14px">${esc(x.n)}</span><div style="height:8px;background:var(--bluesoft)"><i style="display:block;height:100%;width:${Number(x[k])/maxIt*100}%;background:${GC[i%3]}"></i></div><span class="num" style="font-size:14px">${money(x[k])}</span></div>`).join('')}`}).join('')}</div>`;

  }
  const tr=[...Array(6)].map((_,i)=>shiftM(ym,i-5)).map(m=>{const l=gastosMes(m);return {m,p:sum(l.filter(x=>x.area!=='foto')),f:sum(l.filter(x=>x.area==='foto'))}});const tmax=Math.max(1,...tr.map(x=>x.p+x.f));
  return `${back('fhome','Finanzas')}<p class="kicker">01</p><h2 style="margin-top:2px">El mes en detalle</h2>${mnav('fnav',ym)}
  <div class="row" style="max-width:560px;align-items:end;margin-top:16px"><div><label for="ing">Ingreso del mes (COP)</label><input id="ing" inputmode="numeric" data-act="ingreso" value="${ingreso?esc(ingreso.toLocaleString('es-CO')):''}" placeholder="Cuando tengas empleo"></div>${ingreso?`<p class="muted" style="margin:0 0 10px;font-size:14px">${money(ingreso/20)} por día laboral (20 días)</p>`:''}</div>
  <div class="kpis"><div class="kpi red"><div class="v">${ingreso?money(disp-gp):'—'}</div><div class="k">te queda para gastos personales</div></div><div class="kpi"><div class="v">${money(gp+gf)}</div><div class="k">gastado este mes</div></div><div class="kpi"><div class="v">${paid} / ${(c.fijos||[]).length}</div><div class="k">pagos fijos hechos</div></div><div class="kpi"><div class="v">${mes.ahorroHecho?'Hecho':'Pendiente'}</div><div class="k">ahorro de ${esc(short(ahorro))}</div></div></div>
  <div class="grid2"><section>${sec(1,'En qué se fue')}${bubbles(g)}${ingreso?budget('Gastos personales',gp,Math.max(disp,0)):''}${budget('Fotografía',gf,arte,arte?'':'Define un apartado para arte en Configuración.')}</section>
  <section id="addg">${sec(2,'Anotar gasto')}${gastoForm('all')}</section></div>
  ${sec(3,'Pagos fijos del mes')}${(c.fijos||[]).length?(c.fijos||[]).map(f=>`<label class="fx"><input type="checkbox" data-act="pago" data-id="${esc(f.id)}"${pag[f.id]?' checked':''}><span>${esc(f.name)}</span><span class="num">${money(f.amount)}</span></label>`).join(''):'<div class="empty">Agrega tus pagos fijos en Configuración.</div>'}
  <label class="fx" style="border-bottom:1px solid var(--line)"><input type="checkbox" data-act="ahorro"${mes.ahorroHecho?' checked':''}><span><strong>Ahorro / inversión del mes</strong></span><span class="num">${money(ahorro)}</span></label>
  <details><summary>${pad(4)} · Lista de gastos · ${esc(money(gp+gf))}</summary>${g.length?g.map(gastoCard).join(''):'<div class="empty">Sin gastos anotados este mes.</div>'}</details>
  <details><summary>${pad(5)} · Últimos seis meses</summary><div class="trend" style="margin-top:14px">${tr.map(x=>`<div class="${x.m===ym?'cur':''}"><em>${x.p+x.f?esc(short(x.p+x.f)):''}</em>${x.f?`<i style="height:${x.f/tmax*100}%;background:var(--red)"></i>`:''}${x.p?`<i style="height:${x.p/tmax*100}%;background:var(--blue)"></i>`:''}${x.p+x.f?'':'<i style="height:3px;background:var(--line)"></i>'}<span>${esc(MESES[Number(x.m.slice(5))-1].slice(0,3))}</span></div>`).join('')}</div><div class="legend"><span><i style="background:var(--blue)"></i>Personal</span><span><i style="background:var(--red)"></i>Fotografía</span></div></details>
  <details><summary>${pad(6)} · Configuración: pagos fijos, ahorro y arte</summary><p class="muted" style="font-size:14px">Cambia nombres o montos; se guardan al salir del campo.</p>
  ${(c.fijos||[]).map(f=>`<div class="cfg"><input data-act="fx" data-f="name" data-id="${esc(f.id)}" value="${esc(f.name)}" aria-label="Nombre"><input data-act="fx" data-f="amount" data-id="${esc(f.id)}" inputmode="numeric" value="${esc(Number(f.amount||0).toLocaleString('es-CO'))}" aria-label="Monto"><button class="link" data-act="fxdel" data-id="${esc(f.id)}">Quitar</button></div>`).join('')}
  <form data-form="fijo" class="cfg" style="margin-top:12px"><input name="title" required placeholder="Nuevo pago fijo" aria-label="Nombre"><input name="amount" inputmode="numeric" required placeholder="Monto" aria-label="Monto"><button class="btn small">Agregar</button></form>
  <div class="row" style="margin-top:16px;max-width:560px"><div><label>Meta de ahorro mensual</label><input data-act="cfgn" data-f="ahorro" inputmode="numeric" value="${esc(ahorro.toLocaleString('es-CO'))}"></div><div><label>Apartado mensual para arte</label><input data-act="cfgn" data-f="arte" inputmode="numeric" value="${esc(arte.toLocaleString('es-CO'))}"></div></div></details>`;
}

function render(force){
  const v=view();document.documentElement.dataset.area=v==='inicio'?'':v;
  document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const f=document.activeElement;
  if(!force&&(S.drag||(f&&app.contains(f)&&/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)&&f.type!=='range'))){S.pending=true;return}
  S.pending=false;
  const open=[...app.querySelectorAll('details[open] summary')].map(s=>s.textContent);
  app.innerHTML=v==='hoy'?vHoy():v==='habitos'?vHabitos():v==='arte'?vFoto():v==='lectura'?vLectura():v==='finanzas'?vFin():vInicio();
  if(v==='inicio')mountField();
  app.querySelectorAll('details summary').forEach(s=>{if(open.includes(s.textContent))s.parentElement.open=true});
  const lf=S.lightbox&&byId(S.lightbox);
  lb.innerHTML=lf&&blob(lf.asset)?`<div class="light" role="dialog" aria-label="Foto"><img src="${blob(lf.asset)}" alt=""><button class="btn" data-act="lbclose">Cerrar</button></div>`:'';
}

/* ---------- giro del volumen ---------- */
const setRy=v=>{S.ry=v;const r=document.getElementById('rig');if(r)r.style.setProperty('--ry',v+'deg');const sl=app.querySelector('[data-act=ry]');if(sl)sl.value=((Math.round(v)%360)+360)%360};
document.addEventListener('pointerdown',e=>{const st=e.target.closest('#stage');if(!st)return;S.drag={x:e.clientX,ry:S.ry,moved:false,area:(e.target.closest('[data-area]')||{}).dataset?.area};try{st.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!S.drag)return;const dx=e.clientX-S.drag.x;if(Math.abs(dx)>5)S.drag.moved=true;if(S.drag.moved)setRy(S.drag.ry+dx*0.45)});
const endDrag=()=>{if(!S.drag)return;const d=S.drag;S.drag=null;if(!d.moved&&d.area){if(S.sel===d.area)goArea(d.area);else{S.sel=d.area;render(true)}}else if(S.pending)render()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',()=>{S.drag=null});
document.addEventListener('input',e=>{if(e.target.dataset.act==='ry')setRy(Number(e.target.value));if(e.target.id==='nota')saveNote(e.target.dataset.date,e.target.value.trim())});

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;const t=today();
  if(a==='tog')toggle(b.dataset.date,b.dataset.k);
  else if(a==='pick'){S.sel=id;render(true)}
  else if(a==='go')goArea(id);
  else if(a==='range'){S.range=Number(b.dataset.v);render(true)}
  else if(a==='hgo'){const ar=b.dataset.area;S.jump={a:ar,s:b.dataset.sub||''};if(view()===ar)applyJump();else location.hash=ar}
  else if(a==='rot')setRy(S.ry+Number(b.dataset.d));
  else if(a==='lgo'){S.lview=b.dataset.v;S.bOpen=null;render(true);window.scrollTo(0,0)}
  else if(a==='lhome'){S.lview=null;render(true);window.scrollTo(0,0)}
  else if(a==='bopen'){S.bOpen=S.bOpen===id?null:id;render(true)}
  else if(a==='bjump'){const bk=byId(id);if(bk){S.lview=bk.status==='empezado'?'empezados':'leidos';S.bOpen=id;render(true);window.scrollTo(0,0)}}
  else if(a==='rate'){const bk=byId(id);const n=Number(b.dataset.n);patch(id,{rating:bk&&bk.rating===n?0:n});render(true)}
  else if(a==='bstart'){patch(id,{status:'empezado',startedAt:t});render(true)}
  else if(a==='bfinish'){patch(id,{status:'leido',finishedAt:t});S.bOpen=null;render(true)}
  else if(a==='copen'){S.cOpen=S.cOpen===id?null:id;render(true)}
  else if(a==='cmove'){const l=compras();const i=l.findIndex(x=>x.id===id);const j=i+Number(b.dataset.d);if(i<0||j<0||j>=l.length)return;l.forEach((x,k)=>{if(x.rank!==k)patch(x.id,{rank:k})});const A=l[i],B=l[j];patch(A.id,{rank:j});patch(B.id,{rank:i});render(true)}
  else if(a==='cdone'){patch(id,{done:true,doneAt:new Date().toISOString()});S.cOpen=null;render(true)}
  else if(a==='cundo'){const l=compras();patch(id,{done:false,rank:l.length?Math.max(...l.map(x=>x.rank||0))+1:0});render(true)}
  else if(a==='ropen'){S.refOpen=S.refOpen===id?null:id;render(true)}
  else if(a==='refby'){S.refBy=b.dataset.k;render(true)}
  else if(a==='rjump'){e.preventDefault();const el=[...app.querySelectorAll('.rgroup')].find(x=>x.dataset.g===b.dataset.g);if(el)el.scrollIntoView({behavior:'smooth'})}
  else if(a==='rtag'){const r=byId(id);if(r){const f=b.dataset.f,v=b.dataset.v;const cur=[...(r[f]||[])];const i=cur.indexOf(v);if(i>=0)cur.splice(i,1);else cur.push(v);patch(id,{[f]:cur});render(true)}}
  else if(a==='step'){S.step=b.dataset.k;render(true);if(innerWidth<860){const el=app.querySelector('.steppanel');if(el)el.scrollIntoView({block:'center'})}}
  else if(a==='mins'||a==='minsfull'||a==='minszero'){const day=dayOf(t);const AS=activeSteps();const cur=AS.findIndex(s=>stepPct(s,day)<100);const k=S.step||(cur>=0?AS[cur].k:AS[0].k);const s=STEPS.find(x=>x.k===k);const m=Number((day.mins||{})[k])||0;
    setMins(t,k,a==='minsfull'?Math.max(m,ideal(s)):a==='minszero'?0:m+Number(b.dataset.v))}
  else if(a==='togstep'){editDay(t,day=>{if(day.cel)delete day.cel;else day.cel='full'})}
  else if(a==='tab'){S.tab=b.dataset.tab;S.askDel=null;S.serie=null;render(true);window.scrollTo(0,0)}
  else if(a==='home'){S.tab=null;S.serie=null;render(true);window.scrollTo(0,0)}
  else if(a==='fgo'){S.fview=b.dataset.v;render(true);if(b.dataset.add){const el=document.getElementById('addg');if(el)el.scrollIntoView()}else window.scrollTo(0,0)}
  else if(a==='fhome'){S.fview=null;render(true);window.scrollTo(0,0)}
  else if(a==='askdel'){S.askDel=id;render(true)}
  else if(a==='nodel'){S.askDel=null;render(true)}
  else if(a==='del')del(id);
  else if(a==='delg')delGasto(id);
  else if(a==='mnav'){S.month=shiftM(S.month,Number(b.dataset.d));render(true)}
  else if(a==='fnav'){S.fmonth=shiftM(S.fmonth,Number(b.dataset.d));render(true)}
  else if(a==='open'){S.serie=id;S.pfilter='';render(true);window.scrollTo(0,0)}
  else if(a==='back'){S.serie=null;render(true)}
  else if(a==='pf'){S.pfilter=b.dataset.k;render(true)}
  else if(a==='itype'){S.ideaT=b.dataset.t;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}
  else if(a==='lb'){S.lightbox=id;render(true)}
  else if(a==='lbclose'){S.lightbox=null;render(true)}
  else if(a==='toserie'){const x=byId(id);if(x){addItem({kind:'serie',title:x.title.split('\n')[0].slice(0,80),concept:x.title+(x.notes?'\n'+x.notes:''),status:'Idea',format:'Ambas',statement:'',start:t});del(id)}}
  else if(a==='fxdel'){const c=structuredClone(cfg());c.fijos=(c.fijos||[]).filter(f=>f.id!==id);saveCfg(c)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.lightbox){S.lightbox=null;render(true)}});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset.act;if(!a)return;
  if(a==='done')patch(el.dataset.id,{done:el.checked});
  else if(a==='ifield'){const it=byId(el.dataset.id);const d={[el.dataset.f]:el.value};if(it&&it.kind==='libro'&&el.dataset.f==='status'){if(el.value==='leido'&&!it.finishedAt)d.finishedAt=today();if(el.value==='empezado'&&!it.startedAt)d.startedAt=today()}patch(el.dataset.id,d);if(['mark','status','finishedAt'].includes(el.dataset.f))render(true)}
  else if(a==='rtagnew'){const r=byId(el.dataset.id);const v=el.value.trim();if(r&&v){const f=el.dataset.f;const cur=[...(r[f]||[])];if(!cur.includes(v))cur.push(v);patch(r.id,{[f]:cur});render(true)}}
  else if(a==='arte'){const L=structuredClone(linea());L[el.dataset.f]=el.value.trim();saveArte(L)}
  else if(a==='arteP'){const L=structuredClone(linea());L.postura=el.value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const k=x.indexOf(':');return k>0?{t:x.slice(0,k).trim(),d:x.slice(k+1).trim()}:{t:'',d:x}});saveArte(L)}
  else if(a==='arteC'||a==='arteL'){const L=structuredClone(linea());const arr=a==='arteC'?L.conceptos:L.lineas;arr[+el.dataset.i][el.dataset.f]=el.value.trim();saveArte(L)}
  else if(a==='bflag'){patch(el.dataset.id,{[el.dataset.f]:el.checked});render(true)}
  else if(a==='bcov'){const f=el.files&&el.files[0];const id=el.dataset.id;el.value='';if(f)uploadOne(f).then(r=>{if(!r)return;const it=byId(id);const old=it&&it.cover;patch(id,{cover:r});render(true);if(old&&S.assets)S.assets.delete(old).catch(()=>{})})}
  else if(a==='inum'){patch(el.dataset.id,{[el.dataset.f]:toNum(el.value)});render(true)}
  else if(a==='cimg'){const f=el.files&&el.files[0];const id=el.dataset.id;el.value='';if(f)uploadOne(f).then(r=>{if(!r)return;const it=byId(id);const old=it&&it.img;patch(id,{img:r});render(true);if(old&&S.assets)S.assets.delete(old).catch(()=>{})})}
  else if(a==='ifilter'){S.ideaF=el.value;render(true)}
  else if(a==='upload'){const fs=[...el.files];el.value='';upload(fs,el.dataset.serie)}
  else if(a==='pago'){const m=fmes(S.fmonth);saveMes(S.fmonth,{pagados:{...(m.pagados||{}),[el.dataset.id]:el.checked}})}
  else if(a==='ahorro')saveMes(S.fmonth,{ahorroHecho:el.checked});
  else if(a==='ingreso')saveMes(S.fmonth,{ingreso:toNum(el.value)});
  else if(a==='ideal'){const c=structuredClone(S.conf||{});c.ideal={...(c.ideal||{}),[el.dataset.k]:Math.max(0,Number(el.value)||0)};saveConf(c)}
  else if(a==='fx'){const c=structuredClone(cfg());const f=(c.fijos||[]).find(x=>x.id===el.dataset.id);if(f){f[el.dataset.f]=el.dataset.f==='amount'?toNum(el.value):el.value.trim();saveCfg(c)}}
  else if(a==='plan'&&S.plan){const p=structuredClone(S.plan);const x=p.grupos[+el.dataset.g].items[+el.dataset.x];x[el.dataset.f]=el.dataset.f==='n'?el.value.trim():toNum(el.value);savePlan(p)}
  else if(a==='planv'&&S.plan){const p=structuredClone(S.plan);if(el.dataset.o){p[el.dataset.o]=p[el.dataset.o]||{};p[el.dataset.o][el.dataset.k]=toNum(el.value)}else p[el.dataset.k]=toNum(el.value);savePlan(p)}
  else if(a==='plannotes'&&S.plan){const p=structuredClone(S.plan);p.notas=el.value.split('\n').map(x=>x.trim()).filter(Boolean);savePlan(p)}
  else if(a==='colchon'&&S.plan){const p=structuredClone(S.plan);p.colchonActual=toNum(el.value);savePlan(p)}
  else if(a==='cfgn'){const c=structuredClone(cfg());c[el.dataset.f]=toNum(el.value);saveCfg(c)}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{const f=document.activeElement;if(S.pending&&!S.drag&&!(f&&app.contains(f)&&/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)&&f.type!=='range'))render()},0)});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form;const fd=Object.fromEntries(new FormData(f).entries());for(const k in fd)fd[k]=String(fd[k]).trim();
  if(kind==='libro'){if(!fd.title||!need())return;const file=f.querySelector('input[type=file]')?.files?.[0];const st=fd.status||'quiero';const data={kind:'libro',title:fd.title,author:fd.author||'',status:st,rating:Number(fd.rating)||0,finishedAt:st==='leido'?(fd.finishedAt||today()):'',startedAt:st==='empezado'?today():'',kindle:!!fd.kindle,fisico:!!fd.fisico,tengoFisico:false,cover:'',notes:''};f.reset();
    if(file)uploadOne(file).then(r=>{data.cover=r||'';addItem(data)});else addItem(data);return}
  if(kind==='compra'){if(!fd.title||!need())return;const file=f.querySelector('input[type=file]')?.files?.[0];const l=compras();const data={kind:'compra',title:fd.title,price:toNum(fd.price),saved:toNum(fd.saved),url:safeUrl(fd.url)||'',note:fd.note||'',img:'',done:false,rank:l.length?Math.max(...l.map(x=>x.rank||0))+1:0};f.reset();
    if(file)uploadOne(file).then(r=>{data.img=r||'';addItem(data)});else addItem(data);return}
  if(kind==='gasto'){const amount=toNum(fd.amount);if(!amount)return;addGasto({amount,cat:fd.cat,area:areaOf(fd.cat),date:fd.date||today(),note:fd.note||''});f.reset();return}
  if(kind==='fijo'){const amount=toNum(fd.amount);if(!fd.title)return;const c=structuredClone(cfg());c.fijos=[...(c.fijos||[]),{id:'f'+Date.now().toString(36),name:fd.title,amount}];saveCfg(c);return}
  if(!fd.title)return;const data={kind,title:fd.title};
  if(kind==='conv')Object.assign(data,{date:fd.date,theme:fd.theme||'',serie:fd.serie||'',url:fd.url||'',notes:fd.notes||'',status:'Por revisar'});
  if(kind==='lec')Object.assign(data,{author:fd.author||'',type:fd.type||'Teoría',status:'Pendiente'});
  if(kind==='ref')Object.assign(data,{origen:fd.origen||'',nota:fd.nota||'',medios:[],ejes:[],capas:[],where:'',why:'',take:'',obras:'',url:''});
  if(kind==='fuente'){if(!safeUrl(fd.url)){say('El enlace debe empezar por https://');return}Object.assign(data,{url:fd.url,notes:fd.notes||''})}
  if(kind==='tarea')Object.assign(data,{date:fd.date||'',done:false});
  if(kind==='serie')Object.assign(data,{linea:fd.linea||'',format:fd.format||'Ambas',status:'Idea',concept:'',statement:'',meta:fd.meta||'',start:today()});
  if(kind==='idea')Object.assign(data,{type:S.ideaT,serie:fd.serie||'',notes:''});
  if(kind==='nota')Object.assign(data,{serie:f.dataset.serie,date:today()});
  if(kind==='contacto')Object.assign(data,{type:fd.type||'Galería',city:fd.city||'',contact:fd.contact||'',next:fd.next||'',url:fd.url||'',notes:fd.notes||'',status:'Por contactar'});
  addItem(data);f.reset();
});
window.addEventListener('hashchange',()=>{S.askDel=null;S.lightbox=null;const v=view();if(v==='arte'&&!S.serie)S.tab=null;if(v==='finanzas'&&S.fview!=='meta')S.fview=null;if(v==='lectura')S.lview=null;render(true);window.scrollTo(0,0);if(v!=='finanzas')S.fview=null;applyJump()});
let lastW=innerWidth;window.addEventListener('resize',()=>{if((innerWidth<640)!==(lastW<640)||(innerWidth<600)!==(lastW<600)){lastW=innerWidth;render()}});
render(true);

(async()=>{
  let db=null;try{db=await Bitacora.use('db')}catch(e){say(e&&e.message?e.message:'No se pudo conectar el almacenamiento.');return}
  S.db=db;try{S.assets=await Bitacora.use('assets')}catch(_){S.assets=null}
  Bitacora.onAssets(()=>render(true));
  const timer=setTimeout(()=>say('Los datos están tardando en cargar. Revisa tu conexión; lo que veas puede no estar al día.'),10000);
  const seen=new Set();const ok=k=>snap=>{if(!snap.metadata.fromCache&&!seen.has(k)){seen.add(k);if(seen.size>=8){clearTimeout(timer);if(/tardando/.test(statusEl.textContent))say('')}}};
  const fail=()=>{clearTimeout(timer);say('Se perdió la conexión con los datos. Recarga la página para volver a conectar.')};
  db.collection('log').onSnapshot(s=>{const L={};s.docs.forEach(d=>{L[d.id]=d.data()});S.logs=L;ok('log')(s);render()},fail);
  db.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({...d.data(),id:d.id}));ok('items')(s);render()},fail);
  db.collection('gastos').onSnapshot(s=>{S.gastos=s.docs.map(d=>({...d.data(),id:d.id}));ok('gastos')(s);render()},fail);
  db.collection('finmes').onSnapshot(s=>{const M={};s.docs.forEach(d=>{M[d.id]=d.data()});S.fmes=M;ok('finmes')(s);render()},fail);
  db.doc('fin/plan').onSnapshot(d=>{S.plan=d.exists?d.data():null;ok('plan')(d);render()},fail);
  db.doc('fin/config').onSnapshot(d=>{S.cfg=d.exists?d.data():null;ok('cfg')(d);render()},fail);
  db.doc('arte/linea').onSnapshot(d=>{S.arte=d.exists?d.data():null;ok('arte')(d);render()},fail);
  db.doc('conf/dia').onSnapshot(d=>{S.conf=d.exists?d.data():null;ok('conf')(d);render()},fail);
})();
}
</script>
